name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # ffmpeg is a prerequisite of `make check` because the clip generator
      # needs it. CI never renders clips, but the check should not lie.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make check
      - run: make install
      - run: make typecheck
      - run: make test
      - run: make build
