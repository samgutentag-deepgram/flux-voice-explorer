# project-hub authored config. Only what a repo scan cannot find.
# .hub/index.html is derived from a scan plus this file. Edit here, then regenerate.
#
# Seeded 2026-08-24, after the build rather than during it. The ledger is backfilled
# from docs/build-log.md and says so in its own header. Everything appended from here
# is written live, which is the only kind that is worth much.

wordmark: deepgram
title: Flux Voice Explorer
eyebrow: 36 voices, one playhead
lede: >
  Every Deepgram Flux TTS voice reading the same script, on one shared playhead. Built and
  deployed 2026-08-20 to 21. The campaign takes the hot slot on 2026-08-27, so the board below
  is about advocacy from here, not about the build.

objectives:
  - name: Build the explorer
    state: done
    detail: >
      Fifteen commits, rewritten into build order so the history reads as a tutorial. Grid,
      transport, ticker tape, waveform, per-voice orbs. The four wrong turns are the interesting
      part and all four were measured rather than guessed. See docs/build-log.md.

  - name: Deploy and harden
    state: done
    detail: >
      Live at dg-devrel-flux-voice-explorer.fly.dev. Two review passes caught twelve issues, four
      of which would have shipped. The pause bug found after deploy is fixed: auto-pause moved off
      the grid container onto the tile, which also means crossing a gutter now freezes the playhead
      instead of running it forward in silence.

  - name: Advocacy intake
    state: now
    detail: |
      Day 0 is 2026-08-27, when HN Radio leaves the hot slot. Three angle cards are written and all
      five gate criteria hold on each, so this can start without an intake day.

      Three drops planned, deliberately small: personal post, social thread, and one short video.
      A small demo gets a small push.

      Next: nothing here until HN Radio records its hot-ended date. Per docs/slate.md the offset is
      however long hot actually takes, not the nominal ten, and hot has already cost fifteen days.

  - name: The three drops
    state: todo
    detail: >
      d1 personal post plus the thread, d10 the short video, d30 clips. Seven tasks already exist
      in Asana under "Small demo push: Flux Voice Explorer", two of them closed. Task 4 is the grid
      sweep recording and it is ready to shoot.

  - name: Day 90 read
    state: later
    detail: >
      2026-11-25. Blocked on the same unblessed baseline as HN Radio, so it can report activity and
      cannot claim the metric moved. Owner is Chris Hanson, read surface is Superset.

local:
  dev_url: http://localhost:8080

reference:
  Live:
    - name: 🎧 The explorer
      url: https://dg-devrel-flux-voice-explorer.fly.dev
      desc: All 36 voices, one script, one playhead.
